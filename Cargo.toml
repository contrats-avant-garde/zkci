# Verifiable-CI prototype (docs/zk-ci-design.md, milestones M1–M3).
#
# The code under test lives under targets/. It is a member here, so
# `cargo test --workspace` also runs its tests natively, the baseline the
# guest's run is compared against.
[workspace]
resolver = "2"
members = ["harness", "guest", "prover", "verify", "targets/example"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
zkci-harness = { path = "harness" }
zkci-verify = { path = "verify" }
# The M0 target: a small pure-logic crate with unit tests, written for this
# repo (a SemVer parser and requirement matcher).
zkci-example = { path = "targets/example" }

# Pinned exactly. The guest's verifying key, the receipt format and the
# docker image used for reproducible builds all depend on this version, and
# `cargo-prove` (which picks the docker tag) must be the same release.
sp1-sdk = "=6.9.0"
sp1-zkvm = "=6.9.0"

anyhow = "1"
bincode = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
