[package]
name = "zkci-verify"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Checks a verifiable-CI receipt against an expected program and git tree"
publish = false

[lib]
name = "zkci_verify"
path = "src/lib.rs"

[[bin]]
name = "zkci-verify"
path = "src/main.rs"

[dependencies]
zkci-harness.workspace = true
# Verification only (the light prover never proves). A smaller verifier
# (sp1-verifier, or a Groth16 wrap) is a later step: see zkci/README.md.
sp1-sdk.workspace = true
anyhow.workspace = true
bincode.workspace = true
clap.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
