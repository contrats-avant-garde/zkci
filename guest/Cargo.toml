[package]
name = "zkci-guest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "zkVM guest that runs the zkci-example unit tests and commits a SuiteReport"
publish = false

[features]
# Per-test cycle-tracker markers. For measurement only: the markers cost
# cycles, so a guest built with them is not the one to prove.
cycle-tracker = ["zkci-harness/cycle-tracker"]

[dependencies]
zkci-harness.workspace = true
# The crate under test. Its test module imports nothing else.
zkci-example.workspace = true

[target.'cfg(target_os = "zkvm")'.dependencies]
sp1-zkvm.workspace = true

# Native mode prints the report as JSON.
[target.'cfg(not(target_os = "zkvm"))'.dependencies]
serde_json.workspace = true

[build-dependencies]
zkci-harness = { workspace = true, features = ["build"] }
