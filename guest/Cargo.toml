[package]
name = "zkci-guest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "zkVM guest that runs the api-types unit tests and commits a SuiteReport"
publish = false

[dependencies]
zkci-harness.workspace = true
# The crate under test, and what its test module imports.
api-types.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "zkvm")'.dependencies]
sp1-zkvm.workspace = true

[build-dependencies]
zkci-harness = { workspace = true, features = ["build"] }
