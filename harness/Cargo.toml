[package]
name = "zkci-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Runs a crate's existing #[test] functions inside a zkVM guest, or natively"
publish = false

[features]
# The build-script half: parse a test module, strip the attributes a
# non-test build would drop the functions for, and generate the case list.
# Only guest build scripts enable it, so syn never reaches a guest binary.
build = ["dep:syn", "dep:quote", "dep:proc-macro2", "dep:prettyplease"]
# Prints SP1 `cycle-tracker-report-*` markers around each case, so a
# `profiling` executor reports cycles per test.
cycle-tracker = []

[dependencies]
serde.workspace = true
syn = { version = "2", features = ["full"], optional = true }
quote = { version = "1", optional = true }
proc-macro2 = { version = "1", optional = true }
# Formats the generated module so a failing assertion points at a real line.
prettyplease = { version = "0.2", optional = true }
